<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <h1 id="titulo">Meu Site</h1>

    <p class="info">HTML</p>
    <p class="info">CSS</p>
    <p class="info">JavaScript</p>
    <script>
        var t1 = window.document.getElementById('titulo')
        var p1 = window.document.getElementsByClassName('info')[2]
        t1.innerText = 'Tecnologias Web'
        p1.innerText = 'Estou aprendendo JavaScript!'
    </script>
</body>
</html>
