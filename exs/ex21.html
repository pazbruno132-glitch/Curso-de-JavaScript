<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <script>
        var n1 = Number(window.prompt('Digite um número: '))

        var a = n1 += 5
        var b = n1 -= 3
        var c = n1 *= 2 
        var d = n1 /= 4
        var e = n1++
        var f = n1--

        window.alert(`${a}
${b}
${c}
${d}
${e}
${f}`)
    </script>
</body>
</html>
