<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <input type="number" name="nt1" id="nt1">
    <input type="number" name="nt2" id="nt2">
    <input type="number" name="nt3" id="nt3">

    <button id="botao" onclick="media()">Calcular média</button>

    <p id="resultado"></p>

    <script>
        function media() {
            var n1 = document.getElementById('nt1')
            var n2 = document.getElementById('nt2')
            var n3 = document.getElementById('nt3')
            var p1 = document.getElementById('resultado')

            n1 = Number(nt1.value)
            n2 = Number(nt2.value)
            n3 = Number(nt3.value)
            p1 = ((n1+n2+n3) / 3)
            
            document.getElementById('resultado').innerText = p1
        }
    </script>
</body>
</html>
