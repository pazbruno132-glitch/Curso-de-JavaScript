<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <input type="number" name="tn1" id="tn1">
    <input type="number" name="tn2" id="tn2">

    <button onclick="maior()">Verificar</button>

    <p id="res"></p>

    <script>
        function maior() {
            var n1 = document.getElementById('tn1')
            var n2 = document.getElementById('tn2')
            var p1 = document.getElementById('res')

            n1 = Number(tn1.value)
            n2 = Number(tn2.value)

            if (n1 > n2) {
                p1.innerHTML = 'O primeiro número é maior.'
            } else {
                p1.innerHTML = 'O segundo número é maior ou igual.'
            }
        }
    </script>
</body>
</html>
