<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <p id="texto" onmouseout="saiu()">Passe o mouse e depois retire.</p>
    <script>
        function saiu() {
            var p1 = document.getElementById('texto')
            p1.innerText = 'O mouse saiu!'
        }
    </script>
</body>
</html>
