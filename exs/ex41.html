<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            background-color: red;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            color: white;
        }
    </style>
</head>
<body>
    <div id="area" onmouseenter="entrou()"><p>Passe o mouse aqui</p></div>
    <script>
        function entrou() {
            var d1 = document.getElementById('area')

            d1.innerText = 'O mouse entrou'
            d1.style.color = 'blue'
        }
    </script>
</body>
</html>
