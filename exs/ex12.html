<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <script>
        var produto = window.prompt('Nome do produto: ')
        var preco = Number(window.prompt('Quanto custa ? '))
        window.alert(`Produto: ${produto}
Preço: ${preco.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}`)
    </script>
</body>
</html>
