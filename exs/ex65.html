<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <script>
        function verificarIdade(idade) {
            if (idade >= 18) {
                return 'Maior de idade'
            } else {
                return 'Menor de idade'
            }
        }

        var res = verificarIdade(18)

        console.log(res)
    </script>
</body>
</html>
