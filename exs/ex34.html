<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <p class="mensagem">Mensagem original</p>
    <script>
        var p1 = window.document.querySelector('.mensagem')
        p1.style.color = 'green'
        p1.style.fontSize = '24px'
        p1.innerText = 'DOM é muito interessante!'
    </script>
</body>
</html>
