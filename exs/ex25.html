<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }

        body{
            width: 100vw;
            height: 100vh;
            background-color: gray;
        }

        div{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: green;
            color: white;
            width: 200px;
            height: 200px;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <div id="area" onclick="clicar()">Clique em mim</div>
    <script>
        function clicar(){
        var d1 = window.document.querySelector('#area')
        d1.innerText = 'Você clicou!'
        }
    </script>
</body>
</html>
