<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <script>
        var nome = window.prompt('Qual é o seu nome ?')
        var idade = Number(window.prompt('Quantos anos você tem ?'))
        var cidade = window.prompt('Em que cidade você mora ?')
        var profissao = window.prompt('Qual é a sua profissão ?')
        window.alert(`Nome: ${nome}
Idade: ${idade} anos
Cidade: ${cidade}
Profissão: ${profissao}`)
    </script>
</body>
</html>
