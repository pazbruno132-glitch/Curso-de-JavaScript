<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <h1 id="titulo">Meu perfil</h1>
    <p id="nome">Nome: Bruno</p>
    <p id="curso">Curso: JavaScript</p>

    <script>
        var t1 = window.document.getElementById('titulo')
        var p1 = window.document.getElementById('nome')
        var p2 = window.document.getElementById('curso')
        t1.innerText = 'Meu Perfil de Programador'
        p1.innerText = 'Nome: Seu Nome'
        p2.innerText = 'Curso: JavaScript e DOM'
        t1.style.fontSize = '35px'
    </script>
</body>
</html>
