<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <script>
        var nome = window.prompt('Qual é o seu nome ?')
        var produto = window.prompt('Nome do produto: ')
        var preco = Number(window.prompt('Preço do produto: '))
        var quantidade = window.prompt('Quantidade comprada: ')
        window.alert(`Cliente: ${nome}
Produto: ${produto}
Preço: ${preco.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}
Quantidade: ${quantidade}`)
    </script>
</body>
</html>
