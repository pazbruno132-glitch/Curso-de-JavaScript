<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <script>
        var nome = window.prompt('Qual é o seu nome ?')
        var sal = Number(window.prompt('Qual é o seu salario ?'))
        window.alert(`${nome} recebe ${sal.toLocaleString('pt-BR' , {style: 'currency' , currency: 'BRL'})} por mês.`)
    </script>
</body>
</html>
