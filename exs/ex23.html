<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <p class="texto">Paragrafo1</p>
    <p class="texto">Paragrafo2</p>
    <p class="texto">Paragrafo3</p>
    <script>
        var p = window.document.getElementsByClassName('texto')
        p[0].style.color = 'red'
        p[1].style.color = 'blue'
        p[2].style.color = 'green'
    </script>
</body>
</html>
