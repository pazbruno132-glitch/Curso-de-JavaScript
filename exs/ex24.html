<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <h1 id="titulo">Meu site</h1>
    <div class="caixa"><p>Clique aqui....</p></div>
    <script>
        var t1 = window.document.querySelector('#titulo')
        var d1 = window.document.querySelector('.caixa')
        t1.innerText = 'Nosso Site'
        t1.style.color = 'red'
        d1.style.background = 'black'
        d1.style.color = 'white'
        
    </script>
</body>
</html>
