<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <script>
        var n1 = Number(window.prompt('Me fale um número: '))
        var n2 = Number(window.prompt('Me fale outro número: '))
        var s = n1+n2
        window.alert(`Aqui está o valor que você ira pagar: ${s.toLocaleString('pt-BR', {style: "currency", currency: 'BRL'})}`)
    </script>
</body>
</html>
