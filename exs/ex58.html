<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <p>Digite dois números: </p>
    <input type="number" name="nt1" id="nt1">
    <input type="number" name="nt2" id="nt2"> <br> <br>

    <button id="b1" class="b" onclick="operações()">Somar</button>
    <button id="b2" class="b" onclick="operações()">Subtrair</button>
    <button id="b3" class="b" onclick="operações()">Multiplicar</button>
    <button id="b4" class="b" onclick="operações()">Dividir</button>

    <p id="res"></p>
    <p id="res2"></p>
    <p id="res3"></p>
    <p id="res4"></p>

    <script>
        function operações() {
            var n1 = document.getElementById('nt1')
            var n2 = document.getElementById('nt2')
            var p1 = document.getElementById('res')
            var p2 = document.getElementById('res2')
            var p3 = document.getElementById('res3')
            var p4 = document.getElementById('res4')
            var b = document.getElementById('b')

            var b1 = document.getElementById('b1')
            var b2 = document.getElementById('b2')
            var b3 = document.getElementById('b3')
            var b4 = document.getElementById('b4')


            n1 = Number(nt1.value)
            n2 = Number(nt2.value)

            p1 = n1 + n2
            p2 = n1 - n2
            p3 = n1 * n2
            p4 = n1 / n2

            switch (b) {
                case b1:
                    document.getElementById('res').innerText = p1
                    break

                case b2:
                    document.getElementById('res2').innerText = p2
                    break
                case b3:
                    document.getElementById('res3').innerText = p3
                    break
                case b4:
                    document.getElementById('res4').innerText = p4
                    break
                default:
                    p1.innerText = 'Invalido'
                    break
            }
        }
    </script>
</body>
</html>
