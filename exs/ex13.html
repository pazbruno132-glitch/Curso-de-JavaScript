<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <script>
        var nome = window.prompt('Qual é o seu nome ?')
        var cidade = window.prompt('Em que cidade você mora ?')
        window.alert(`Seu nome é ${nome.toLocaleUpperCase()} e você mora em ${cidade.toLocaleLowerCase()}.`)
    </script>
</body>
</html>
