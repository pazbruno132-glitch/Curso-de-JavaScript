<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <p name="p">HTML</p>
    <p name="p">CSS</p>
    <p name="p">JavaScript</p>
    <script>
        var p1 = window.document.getElementsByName('p')[1]
        p1.style.color = 'red'
        p1.style.fontSize = '30px'
    </script>
</body>
</html>
